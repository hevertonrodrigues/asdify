name: Validate ASDify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check installer syntax
        run: bash -n scripts/install.sh
      - name: Validate skill and fixtures
        run: python3 scripts/validate.py
      - name: Test installer, scoring, language coverage, and evaluation integrity
        run: python3 -m unittest discover -s tests -v
      - name: Audit published model evaluations
        run: |
          python3 scripts/audit_evaluation.py --output benchmarks/results/2026-10-08-reliability-100
          python3 scripts/audit_evaluation.py --output benchmarks/results/2026-10-09-reliability-100-revised
          python3 scripts/evaluate_modes_conservative.py audit --output benchmarks/results/2026-10-09-multilingual-modes-four-workers
          python3 scripts/audit_execution_history.py --output benchmarks/results/2026-10-09-multilingual-modes-four-workers
          python3 scripts/audit_mode_source.py --output benchmarks/results/2026-10-09-multilingual-modes-four-workers
