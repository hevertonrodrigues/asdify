<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1244" viewBox="0 0 1080 1244" role="img" xml:lang="pt-BR" aria-labelledby="title desc">
  <title id="title">Menos excesso. Mesmos fatos.</title>
  <desc id="desc">Reescrita ilustrativa, não um resultado medido. Antes: Gostaríamos de destacar que a receita preliminar de assinaturas cresceu 12% ano a ano no Brasil, excluindo reembolsos. Esses números ainda não foram auditados. Depois: A receita preliminar de assinaturas no Brasil cresceu 12% ano a ano, excluindo reembolsos. Os números ainda não foram auditados. Sete informações preservadas: Preliminar; Receita de assinaturas; 12%; Ano a ano; Brasil; Exclui reembolsos; Não auditado.</desc>
  <rect width="1080" height="1244" rx="24" fill="#F5F1E8"/>
<text x="64" y="98" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="700" letter-spacing="-1.8">Menos excesso. Mesmos fatos.</text><text x="66" y="154" fill="#657181" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" >Reescrita ilustrativa · não é um resultado medido</text><rect x="40" y="202" width="1000" height="346" rx="18" fill="#EAE7DF"/>
<text x="68" y="251" fill="#657181" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="2.5">ANTES</text><text x="68" y="311" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" >Gostaríamos de destacar que a receita</text><text x="68" y="360" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" >preliminar de assinaturas cresceu 12%</text><text x="68" y="409" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" >ano a ano no Brasil, excluindo</text><text x="68" y="458" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" >reembolsos. Esses números ainda</text><text x="68" y="507" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" >não foram auditados.</text><rect x="40" y="576" width="1000" height="320" rx="18" fill="#142130"/>
<rect x="40" y="604" width="5" height="264" rx="2.5" fill="#FFB86B"/>
<text x="68" y="625" fill="#FFB86B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="2.5">DEPOIS</text><text x="68" y="685" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="400" >A receita preliminar de assinaturas</text><text x="68" y="736" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="400" >no Brasil cresceu 12% ano a ano,</text><text x="68" y="787" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="400" >excluindo reembolsos. Os números</text><text x="68" y="838" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="400" >ainda não foram auditados.</text><text x="64" y="960" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" >7 informações preservadas</text><rect x="64" y="992" width="250" height="58" rx="29" fill="#F5F1E8" stroke="#C5BCAE" stroke-width="1.5"/>
