<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1244" viewBox="0 0 1080 1244" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">Less filler. Same facts.</title>
  <desc id="desc">Illustrative rewrite, not a measured result. Before: We would like to highlight that preliminary subscription revenue grew 12% year over year in Brazil, excluding refunds. These figures have not yet been audited. After: Unaudited, preliminary subscription revenue in Brazil grew 12% year over year, excluding refunds. Seven facts retained: Preliminary; Subscription revenue; 12%; Year over year; Brazil; Excluding refunds; Unaudited.</desc>
