<text x="64" y="98" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.8">Less filler. Same facts.</text><text x="66" y="154" fill="#657181" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" >Illustrative rewrite · not a measured result</text><rect x="40" y="202" width="1000" height="346" rx="18" fill="#EAE7DF"/>
<text x="68" y="251" fill="#657181" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="2.5">BEFORE</text><text x="68" y="311" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" >We would like to highlight that</text><text x="68" y="360" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" >preliminary subscription revenue grew</text><text x="68" y="409" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" >12% year over year in Brazil, excluding</text><text x="68" y="458" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" >refunds. These figures have not yet</text><text x="68" y="507" fill="#213044" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" >been audited.</text><rect x="40" y="576" width="1000" height="320" rx="18" fill="#142130"/>
<rect x="40" y="604" width="5" height="264" rx="2.5" fill="#FFB86B"/>
