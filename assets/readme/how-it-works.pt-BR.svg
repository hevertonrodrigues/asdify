<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920" role="img" xml:lang="pt-BR" aria-labelledby="title desc">
  <title id="title">Como o ASDify funciona</title>
  <desc id="desc">Quatro etapas: Leitor: Quem precisa entender?; Fatos: O que precisa permanecer?; Edição: Faça a menor mudança útil.; Revisão: Confira o significado.</desc>
  <rect width="1080" height="920" rx="24" fill="#142130"/>
<text x="64" y="104" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.8">Como o ASDify funciona</text><text x="66" y="160" fill="#B6C0CA" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" >Uma edição pequena. Uma revisão atenta.</text><path d="M100 250v492" stroke="#58606A" stroke-width="2"/>
<circle cx="100" cy="250" r="36" fill="#FFB86B"/>
<text x="100" y="262" fill="#142130" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">1</text><text x="170" y="245" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" >Leitor</text><text x="172" y="298" fill="#C2CBD3" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" >Quem precisa entender?</text><path d="M170 343h846" stroke="#354454" stroke-width="1.5"/>
<circle cx="100" cy="414" r="36" fill="#FFB86B"/>
<text x="100" y="426" fill="#142130" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">2</text><text x="170" y="409" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" >Fatos</text><text x="172" y="462" fill="#C2CBD3" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" >O que precisa permanecer?</text><path d="M170 507h846" stroke="#354454" stroke-width="1.5"/>
<circle cx="100" cy="578" r="36" fill="#FFB86B"/>
<text x="100" y="590" fill="#142130" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">3</text><text x="170" y="573" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" >Edição</text><text x="172" y="626" fill="#C2CBD3" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" >Faça a menor mudança útil.</text><path d="M170 671h846" stroke="#354454" stroke-width="1.5"/>
<circle cx="100" cy="742" r="36" fill="#FFB86B"/>
<text x="100" y="754" fill="#142130" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">4</text><text x="170" y="737" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" >Revisão</text><text x="172" y="790" fill="#C2CBD3" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" >Confira o significado.</text><text x="64" y="876" fill="#FFB86B" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" >O significado define o limite.</text></svg>
