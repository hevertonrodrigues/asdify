<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920" role="img" xml:lang="en" aria-labelledby="title desc">
  <title id="title">How ASDify works</title>
  <desc id="desc">Four steps: Reader: Who needs to understand?; Facts: What must survive?; Edit: Use the smallest useful change.; Check: Verify the meaning.</desc>
  <rect width="1080" height="920" rx="24" fill="#142130"/>
<text x="64" y="104" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.8">How ASDify works</text><text x="66" y="160" fill="#B6C0CA" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" >A small edit. A careful check.</text><path d="M100 250v492" stroke="#58606A" stroke-width="2"/>
<circle cx="100" cy="250" r="36" fill="#FFB86B"/>
<text x="100" y="262" fill="#142130" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">1</text><text x="170" y="245" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" >Reader</text><text x="172" y="298" fill="#C2CBD3" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" >Who needs to understand?</text><path d="M170 343h846" stroke="#354454" stroke-width="1.5"/>
<circle cx="100" cy="414" r="36" fill="#FFB86B"/>
<text x="100" y="426" fill="#142130" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">2</text><text x="170" y="409" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" >Facts</text><text x="172" y="462" fill="#C2CBD3" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" >What must survive?</text><path d="M170 507h846" stroke="#354454" stroke-width="1.5"/>
<circle cx="100" cy="578" r="36" fill="#FFB86B"/>
<text x="100" y="590" fill="#142130" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">3</text><text x="170" y="573" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" >Edit</text><text x="172" y="626" fill="#C2CBD3" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" >Use the smallest useful change.</text><path d="M170 671h846" stroke="#354454" stroke-width="1.5"/>
<circle cx="100" cy="742" r="36" fill="#FFB86B"/>
<text x="100" y="754" fill="#142130" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">4</text><text x="170" y="737" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" >Check</text><text x="172" y="790" fill="#C2CBD3" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" >Verify the meaning.</text><text x="64" y="876" fill="#FFB86B" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" >Meaning is the constraint.</text></svg>
